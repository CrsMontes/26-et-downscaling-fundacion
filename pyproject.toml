[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "et-downscaling-fundacion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api==1.7.38",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]
